<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AskUserQuestion Elicitation Dialog Test</title>
<style>
  body {
    background: #18181b;
    color: #f4f4f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 30px;
    display: flex;
    justify-content: center;
  }
  /* Simulated ZCode elicitation dialog, matching bundle class names */
  .card {
    width: 100%;
    max-width: 720px;
    border: 1px solid #3f3f46;
    background: #1c1c1f;
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    outline: none;
  }
  .body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .header-main { min-width: 0; flex: 1; font-size: 14px; font-weight: 500; line-height: 20px; }
  .header-nav { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; color: #a1a1aa; }
  .badge {
    display: inline-block;
    border: 1px solid #52525b;
    border-radius: 6px;
    padding: 1px 8px;
    font-size: 13px;
    margin-right: 8px;
    vertical-align: baseline;
  }
  .title-span { white-space: pre-wrap; overflow-wrap: break-word; line-height: 24px; color: #f4f4f5; }
  .nav-count { min-width: 40px; text-align: center; }
  .nav-btn {
    background: transparent; border: 0; color: #a1a1aa; cursor: pointer;
    padding: 4px 6px; border-radius: 6px; font-size: 12px;
  }
  .listbox { display: flex; flex-direction: column; gap: 4px; }
  .opt {
    display: flex; width: 100%; align-items: center; gap: 12px;
    border-radius: 12px; padding: 8px 12px; background: transparent;
    border: 0; color: inherit; cursor: pointer; text-align: left;
    outline: none; transition: background .15s; font: inherit;
  }
  .opt:hover { background: #27272a; }
  .opt .num { width: 20px; flex-shrink: 0; align-self: center; font-size: 14px; font-weight: 500; color: #71717a; }
  .opt .txt { min-width: 0; flex: 1; font-size: 14px; line-height: 22px; }
  .opt .txt .label { font-weight: 500; color: #f4f4f5; }
  .opt .txt .desc { margin-left: 8px; font-size: 14px; color: #a1a1aa; }
  .custom {
    display: flex; width: 100%; align-items: center; gap: 12px;
    border-radius: 12px; padding: 8px 12px; cursor: text;
  }
  .custom textarea {
    flex: 1; min-height: 20px; border: 0; background: transparent; color: #f4f4f5;
    font-size: 14px; font-weight: 500; line-height: 22px; outline: none; resize: none;
    font-family: inherit;
  }
  .footer { display: flex; align-items: center; gap: 8px; padding: 0 12px 12px; }
  .hint { display: flex; flex: 1; min-width: 0; align-items: center; gap: 8px; font-size: 14px; color: #a1a1aa; }
  .actions { display: flex; gap: 8px; }
  .btn {
    border-radius: 8px; padding: 6px 14px; font-size: 14px; cursor: pointer;
    border: 1px solid #3f3f46; background: #27272a; color: #f4f4f5;
  }
  .btn.primary { background: #2563eb; border-color: #2563eb; }
</style>
<link rel="stylesheet" href="../patch/rtl-patch.css">
<script src="../patch/rtl-patch.js"></script>
</head>
<body>

<div class="card" data-elicitation-dialog-card="true" tabindex="0">
  <div class="body" data-elicitation-dialog-body="true">

    <div class="header-row">
      <div class="header-main">
        <span class="badge">بازپرداخت</span>
        <span class="title-span">در این فاز چه سرنوشتی داشته باشد؟ (refund) بازپرداخت</span>
      </div>
      <div class="header-nav">
        <button class="nav-btn">&#8249;</button>
        <span class="nav-count">1 / 4</span>
        <button class="nav-btn">&#8250;</button>
      </div>
    </div>

    <div class="listbox" role="listbox" aria-label="در این فاز چه سرنوشتی داشته باشد؟">
      <button class="opt" role="option" aria-selected="false" tabindex="0">
        <span class="num">1.</span>
        <span class="txt"><span class="label">سرریز (پیشنهادی) MVP</span><span class="desc">— مسیر موتوری فاز • مصماید و پل آن فاز spec خارج از محدوده این فاز طبق مرحله</span></span>
      </button>
      <button class="opt" role="option" aria-selected="false" tabindex="-1">
        <span class="num">2.</span>
        <span class="txt"><span class="label">تست موتوری فقط</span><span class="desc">— مسیر بازپرداخت در این فاز اضافه شود تا فاز ۶ مطمئن‌تر باشد — چند تست اضافه بردو UI</span></span>
      </button>
      <button class="opt" role="option" aria-selected="false" tabindex="-1">
        <span class="num">3.</span>
        <span class="txt"><span class="label">جزئیات کامل</span><span class="desc">— همان فاز در MVP با UI جزئیات کامل همان فازران کامل بازپرداخت با</span></span>
      </button>
      <div class="custom" role="checkbox" aria-checked="false" tabindex="-1">
        <span class="num">4.</span>
        <textarea rows="1" placeholder="Enter your answer..."></textarea>
      </div>
    </div>

  </div>

  <div class="footer">
    <div class="hint">&#9432; Use Tab / arrow keys to choose, then Enter or Space to select</div>
    <div class="actions">
      <button class="btn">Dismiss</button>
      <button class="btn primary">Continue</button>
    </div>
  </div>
</div>

</body>
</html>
